<section class="not-found">
  <div class="not-found__art" aria-hidden="true">
    <span class="not-found__code">404</span>
    <span class="not-found__glow"></span>
  </div>

  <div class="not-found__content">
    <p class="not-found__eyebrow">Ошибка</p>
    <h1 class="not-found__title">Кажется, такой страницы нет</h1>
    <p class="not-found__text">
      Возможно, адрес устарел или содержит опечатку. Вернитесь на главную или используйте меню.
    </p>

    <div class="not-found__actions">
      <button type="button" class="cms-btn cms-btn--primary" (click)="goBack()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path
            d="M12 7H2M6 11l-4-4 4-4"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Назад
      </button>
    </div>
  </div>
</section>
